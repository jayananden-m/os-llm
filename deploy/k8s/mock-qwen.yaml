# Stand-in for vLLM. A plain Deployment now: the gateway finds each pod through
# the Service's EndpointSlices, so pods no longer need stable names.
apiVersion: v1
kind: Service
metadata:
  name: mock-qwen
  namespace: os-llm
  labels:
    app.kubernetes.io/name: mock-qwen
    app.kubernetes.io/part-of: os-llm
spec:
  selector:
    app.kubernetes.io/name: mock-qwen
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-qwen
  namespace: os-llm
  labels:
    app.kubernetes.io/name: mock-qwen
    app.kubernetes.io/part-of: os-llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-qwen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-qwen
        app.kubernetes.io/part-of: os-llm
    spec:
      containers:
        - name: server
          image: os-llm/mockllm:dev
          imagePullPolicy: IfNotPresent
          args: ["--port", "8000", "--delay", "3s"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
