# The gateway may only read EndpointSlices, and only in its own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: os-llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-endpointslice-reader
  namespace: os-llm
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-endpointslice-reader
  namespace: os-llm
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: os-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-endpointslice-reader
